name: Fix README formatting

on:
  push:
    branches:
      - docs/continuous-open-source-workflow

permissions:
  contents: write

jobs:
  fix-readme-formatting:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: docs/continuous-open-source-workflow

      - name: Repair section and FAQ spacing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")

          replacements = {
              "continue.\n## How it works": "continue.\n\n## How it works",
              "platform safeguards.\n## Limitations": "platform safeguards.\n\n## Limitations",
              "permission for abuse.- **Does PatchPilot": "permission for abuse.\n- **Does PatchPilot",
          }

          for before, after in replacements.items():
              if before not in text:
                  raise SystemExit(f"README formatting anchor not found: {before!r}")
              text = text.replace(before, after, 1)

          if "—" in text:
              raise SystemExit("README contains a forbidden em dash")

          readme.write_text(text, encoding="utf-8")
          Path(".github/workflows/readme-format-fix.yml").unlink()
          PY

      - name: Commit formatting repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/readme-format-fix.yml
          git commit -m "fix(docs): repair README section spacing"
          git push origin HEAD:docs/continuous-open-source-workflow
